<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// The previewer's own theme (bar, drawer, editor — never the AO3 page in
			// the frame), applied before first paint. Dark unless the browser chose light.
			try { document.documentElement.setAttribute("data-theme", localStorage.getItem("cowriteAo3Theme") === "light" ? "light" : "dark") } catch (e) { document.documentElement.setAttribute("data-theme", "dark") }
		</script>
		<title>AO3 previewer: {{SITE_NAME}}</title>
		<link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<!-- Deliberately chrome-free: no base.css, no chrome.js, no auth. The page
		     is an AO3 work with the author's skin on it, and everything it needs
		     lives in /ao3/. -->

		<link rel="stylesheet" href="/ao3/preview.css" />
	</head>
	<body>
		<header class="ap-bar">
			<span class="ap-title">AO3 previewer</span>
			<a href="/">← {{SITE_NAME}}</a>
			<div class="ap-acts">
				<label class="ap-kind-label" for="apKind">CSS</label>
				<select class="ap-btn ap-kind" id="apKind" aria-label="Kind of skin" title="Work skin: AO3 prefixes every selector with #workskin and it styles the work only. Site skin: applied to the whole page as written.">
					<option value="work">Work skin</option>
					<option value="site">Site skin</option>
				</select>
				<label class="ap-kind-label" for="apPage">Page</label>
				<select class="ap-btn ap-kind ap-page" id="apPage" aria-label="AO3 page shown in the preview" title="Which AO3 page the preview shows — every one is a real page scraped from the site">
					<option value="work">Work</option>
					<option value="home">Homepage</option>
					<option value="media">Fandoms</option>
					<option value="dashboard">Dashboard</option>
					<option value="works">Works</option>
					<option value="works-search">Works search</option>
					<option value="people-search">People search</option>
					<option value="collections">Collections</option>
					<option value="tags">Tags</option>
					<option value="bookmarks">Bookmarks</option>
				</select>
				<span class="ap-tipwrap">
					<button class="ap-btn ap-icon-btn" id="apInspect" type="button" aria-pressed="false" aria-label="Element selector" aria-describedby="apInspectTip">⌖</button>
					<span class="ap-tip" id="apInspectTip" role="tooltip"><b>Element Selector</b>Hover the page, click an element to add its rule to the CSS. Esc to stop.</span>
				</span>
				<button class="ap-btn ap-save" id="apSave" type="button" title="Save the CSS in this browser (⌘/Ctrl+S)">Save CSS</button>
				<button class="ap-btn" id="apResetCss" type="button" title="Back to the shipped default; forgets the saved CSS">Reset CSS</button>
				<button class="ap-btn ap-icon-btn" id="apDownload" type="button" aria-label="Download the CSS" title="Download the CSS as work-skin.css">⬇</button>
				<button class="ap-btn ap-icon-btn" id="apTheme" type="button" aria-label="Switch between dark and light" title="Dark / light">☾</button>
			</div>
		</header>

		<div class="ap-root" id="apRoot">
			<main class="ap-work">
				<!-- The AO3 page lives in an iframe: its own document, so AO3's site
				     stylesheet (default-skin-webscraped.css) and the work skin can't leak into the
				     drawer, and the page runs the full width of the column the way it
				     does on the site. preview.js writes the document. -->
				<!-- while inspecting: the hovered element's ancestry, like Chrome's inspector bar (top of the preview) -->
				<nav class="ap-crumbs" id="apCrumbs" aria-label="Element hierarchy" hidden></nav>
				<iframe id="apFrame" class="ap-frame" title="AO3 work preview"></iframe>
			</main>

			<aside class="doc-side" id="apSide">
				<div class="doc-side-card">
					<div
						class="doc-side-grip"
						id="apGrip"
						role="separator"
						aria-orientation="vertical"
						tabindex="0"
						aria-label="Resize the CSS drawer"
						title="Drag to resize · double-click to reset"
					></div>
					<div class="doc-side-head">
						<div class="ap-tabs" role="tablist" aria-label="Drawer">
							<button class="ap-tab ap-tab-css on" id="apTabCss" type="button" role="tab" aria-selected="true" aria-controls="apPanelCss"><span class="ap-tab-ico" aria-hidden="true">{}</span>CSS<span class="ap-tab-n" id="apTabCssN" hidden></span></button>
							<button class="ap-tab ap-tab-work" id="apTabWork" type="button" role="tab" aria-selected="false" aria-controls="apPanelWork"><span class="ap-tab-ico" aria-hidden="true">&lt;/&gt;</span>Work Content<span class="ap-tab-n" id="apTabWorkN" hidden></span></button>
						</div>
						<span class="ap-issues" id="apIssues"></span>
						<button class="ap-icon" id="apExpand" type="button" aria-label="Expand the drawer" title="Expand">⤢</button>
						<button class="doc-side-close" id="apMin" type="button" aria-label="Minimise the drawer" title="Minimise">
							−
						</button>
					</div>
					<div class="ap-panel" id="apPanelCss" role="tabpanel">
					<!-- CodeMirror mounts here (public/ao3/editor.js, served from /vendor/codemirror.js) -->
					<div class="ap-code" id="apCode"></div>
					<div
						class="ap-split"
						id="apSplit"
						role="separator"
						aria-orientation="horizontal"
						tabindex="0"
						aria-label="Resize the warnings panel"
						title="Drag to resize the warnings · double-click to reset"
					></div>
					<div class="ap-lint" id="apLint"></div>
					</div>
					<!-- Work Content: the fields of AO3's work/chapter edit forms (work-content.js);
					     the work page is a template whose tokens these fill. -->
					<div class="ap-panel ap-work-panel hidden" id="apPanelWork" role="tabpanel">
						<div class="ap-work-acts">
							<button class="ap-btn ap-save" id="apWorkSave" type="button" title="Save these values in this browser">Save content</button>
							<button class="ap-btn" id="apWorkReset" type="button" title="Back to the shipped work; forgets the saved values">Reset content</button>
							<span class="ap-work-note">The work page shows these live.</span>
						</div>
						<form class="ap-work-form" id="apWorkForm" autocomplete="off"></form>
					</div>
				</div>
			</aside>
			<button class="doc-side-tab hidden" id="apTab" type="button" aria-expanded="false" title="Open the CSS drawer">
				CSS
			</button>
		</div>

		<!-- the skin as text only: type="text/plain" keeps it INERT here, so a
		     `button { … }` or `body { … }` rule can never restyle the previewer's own
		     chrome. The copy that paints is the iframe's #apSkin. -->
		<style id="apSkin" type="text/plain"></style>

		<script type="module">
			import { mountPreview } from "/ao3/preview.js"
			mountPreview(document)
		</script>
	</body>
</html>
