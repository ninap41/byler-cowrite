<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mirror ball</title>
<style>
  :root{
    --room-deep:#05060e;
    --room-lift:#1b1440;
    --mirror-hi:#e8f3ff;
    --mirror-mid:#8ea6c8;
    --mirror-low:#3d4c6b;
    --spark-warm:#ffd9a0;
    --spark-cool:#7ee6ff;
    --spark-rose:#ff7ad0;
  }

  *{box-sizing:border-box;}

  html,body{height:100%;margin:0;}

  body{
    background:var(--room-deep);
    overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }

  /* ---------- room ---------- */
  .room{
    position:fixed;
    inset:0;
    background:
      radial-gradient(120% 80% at 50% 6%, rgba(94,74,190,.34) 0%, rgba(28,20,72,.18) 38%, transparent 68%),
      radial-gradient(100% 70% at 50% 118%, rgba(58,40,120,.30) 0%, transparent 60%),
      linear-gradient(#0b0a1c 0%, #070711 55%, #04040a 100%);
  }
  .floor{
    position:fixed;
    left:0;right:0;bottom:0;
    height:34%;
    background:
      linear-gradient(rgba(120,140,200,.10), rgba(120,140,200,0) 55%),
      linear-gradient(#0a0a18, #05050c);
    box-shadow:inset 0 1px 0 rgba(160,180,240,.14);
  }
  .vignette{
    position:fixed;
    inset:0;
    background:radial-gradient(70% 60% at 50% 45%, transparent 40%, rgba(0,0,0,.72) 100%);
    pointer-events:none;
  }

  /* ---------- scene ---------- */
  .scene{
    position:fixed;
    left:50%;
    top:38%;
    width:0;height:0;
    transform-origin:50% 50%;
  }

  /* swept light spots on the walls */
  .spots{position:absolute;left:0;top:0;}
  .tilt{position:absolute;left:0;top:0;transform:scaleY(.44);}
  .orbit{position:absolute;left:0;top:0;}
  .spot{
    position:absolute;
    left:0;top:0;
    width:26px;height:26px;
    margin:-13px 0 0 -13px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 38%, transparent 70%);
    filter:blur(3px);
    mix-blend-mode:screen;
    will-change:transform,opacity;
  }

  /* beams from the ball */
  .beams{
    position:absolute;left:0;top:0;
    mix-blend-mode:screen;
    filter:blur(7px);
    opacity:.85;
  }
  .beam{
    position:absolute;
    left:0;top:0;
    width:60px;height:900px;
    margin-left:-30px;
    transform-origin:50% 0;
    background:linear-gradient(rgba(214,232,255,.30), rgba(190,215,255,.10) 40%, transparent 78%);
    clip-path:polygon(46% 0%, 54% 0%, 100% 100%, 0% 100%);
  }

  /* ---------- the ball ---------- */
  .ball{
    position:absolute;
    left:0;top:0;
    width:280px;height:280px;
    margin:-140px 0 0 -140px;
  }
  .halo{
    position:absolute;
    inset:-120px;
    background:radial-gradient(circle, rgba(206,228,255,.30) 0%, rgba(150,180,255,.10) 34%, transparent 66%);
    mix-blend-mode:screen;
    pointer-events:none;
  }
  .cord{
    position:absolute;
    left:50%;
    bottom:calc(100% - 10px);
    width:3px;
    height:100vh;
    margin-left:-1.5px;
    background:linear-gradient(rgba(180,196,235,0), rgba(180,196,235,.45));
  }
  .stage3d{
    position:absolute;
    inset:0;
    perspective:900px;
  }
  .core{
    position:absolute;
    left:50%;top:50%;
    width:264px;height:264px;
    margin:-132px 0 0 -132px;
    border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #263049 0%, #12172a 60%, #070a14 100%);
  }
  .facets{
    position:absolute;
    left:50%;top:50%;
    width:0;height:0;
    transform-style:preserve-3d;
    will-change:transform;
  }
  .facet{
    position:absolute;
    left:0;top:0;
    border-radius:1.5px;
    backface-visibility:hidden;
    background:
      linear-gradient(150deg, var(--mirror-hi) 0%, var(--mirror-mid) 46%, var(--mirror-low) 100%);
    box-shadow:inset 0 0 0 .5px rgba(6,10,22,.55);
    overflow:hidden;
  }
  .facet::after{
    content:"";
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    animation:glint var(--dur) linear var(--delay) infinite;
  }
  @keyframes glint{
    0%,88%,100%{opacity:0;}
    93%{opacity:.95;}
  }

  /* lighting overlays that stay put while the ball turns */
  .shade{
    position:absolute;
    left:50%;top:50%;
    width:274px;height:274px;
    margin:-137px 0 0 -137px;
    border-radius:50%;
    background:radial-gradient(circle at 33% 27%, rgba(0,0,0,0) 26%, rgba(4,5,14,.52) 68%, rgba(3,4,10,.92) 100%);
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:2;
  }
  .spec{
    position:absolute;
    left:50%;top:50%;
    width:274px;height:274px;
    margin:-137px 0 0 -137px;
    border-radius:50%;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.55) 0%, rgba(214,234,255,.16) 20%, transparent 46%),
      radial-gradient(circle at 74% 78%, rgba(126,230,255,.16) 0%, transparent 34%);
    mix-blend-mode:screen;
    pointer-events:none;
    z-index:3;
  }

  @media (prefers-reduced-motion:reduce){
    .facet::after{animation:none;}
  }
</style>
</head>
<body>
  <div class="room"></div>
  <div class="floor"></div>

  <div class="scene" id="scene">
    <div class="spots" id="spots"></div>
    <div class="beams" id="beams"></div>
    <div class="ball">
      <div class="cord"></div>
      <div class="halo" id="halo"></div>
      <div class="stage3d">
        <div class="core"></div>
        <div class="facets" id="facets"></div>
      </div>
      <div class="shade"></div>
      <div class="spec"></div>
    </div>
  </div>

  <div class="vignette"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  const R = 132;              // sphere radius in px
  const ROWS = 17;            // latitude bands
  const SPIN = 14;            // seconds per revolution
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- build the mirrored sphere ---------- */
  const facets = document.getElementById("facets");
  const tileH = (Math.PI * R) / ROWS;
  const frag = document.createDocumentFragment();

  for (let i = 0; i < ROWS; i++) {
    const lat = -90 + (180 * (i + 0.5)) / ROWS;
    const ringR = Math.cos((lat * Math.PI) / 180) * R;
    const count = Math.max(4, Math.round((2 * Math.PI * ringR) / tileH));
    const tileW = (2 * Math.PI * ringR) / count;

    for (let j = 0; j < count; j++) {
      const lon = (360 * j) / count + (i % 2 ? 180 / count : 0);
      const t = document.createElement("div");
      t.className = "facet";
      t.style.width = tileW + 1.2 + "px";
      t.style.height = tileH + 1.2 + "px";
      t.style.marginLeft = -(tileW + 1.2) / 2 + "px";
      t.style.marginTop = -(tileH + 1.2) / 2 + "px";
      t.style.transform =
        "rotateY(" + lon + "deg) rotateX(" + lat + "deg) translateZ(" + R + "px)";
      t.style.setProperty("--dur", (3 + Math.random() * 7).toFixed(2) + "s");
      t.style.setProperty("--delay", (-Math.random() * 10).toFixed(2) + "s");
      t.style.filter = "brightness(" + (0.82 + Math.random() * 0.36).toFixed(2) + ")";
      frag.appendChild(t);
    }
  }
  facets.appendChild(frag);
  gsap.set(facets, { rotationX: -8, rotationY: 0 });

  /* ---------- beams ---------- */
  const beamHost = document.getElementById("beams");
  const BEAMS = 18;
  for (let i = 0; i < BEAMS; i++) {
    const b = document.createElement("div");
    b.className = "beam";
    const angle = (360 / BEAMS) * i + (Math.random() * 8 - 4);
    b.style.transform = "rotate(" + angle + "deg)";
    b.style.opacity = (0.35 + Math.random() * 0.65).toFixed(2);
    b.style.width = 40 + Math.random() * 70 + "px";
    beamHost.appendChild(b);
  }

  /* ---------- light spots sweeping the room ---------- */
  const spotHost = document.getElementById("spots");
  const tints = [
    "rgba(255,255,255,.95)",
    "rgba(255,255,255,.95)",
    "var(--spark-warm)",
    "var(--spark-cool)",
    "var(--spark-rose)"
  ];
  const SPOTS = 46;
  const spotData = [];

  for (let i = 0; i < SPOTS; i++) {
    const tilt = document.createElement("div");
    tilt.className = "tilt";
    const yLift = -260 + Math.random() * 620;
    tilt.style.transform = "translateY(" + yLift + "px) scaleY(" + (0.3 + Math.random() * 0.3) + ")";

    const orbit = document.createElement("div");
    orbit.className = "orbit";

    const dot = document.createElement("div");
    dot.className = "spot";
    const radius = 240 + Math.random() * 640;
    const size = 0.5 + Math.random() * 1.9;
    const tint = tints[(Math.random() * tints.length) | 0];
    dot.style.background =
      "radial-gradient(circle, " + tint + " 0%, rgba(255,255,255,.28) 40%, transparent 70%)";
    gsap.set(dot, { x: radius, scale: size, opacity: 0.25 + Math.random() * 0.5 });

    orbit.appendChild(dot);
    tilt.appendChild(orbit);
    spotHost.appendChild(tilt);
    spotData.push({ orbit, dot, phase: Math.random(), size });
  }

  /* ---------- motion ---------- */
  if (!reduced) {
    gsap.to(facets, { rotationY: "+=360", duration: SPIN, ease: "none", repeat: -1 });
    gsap.to(beamHost, { rotation: 360, duration: SPIN, ease: "none", repeat: -1 });

    spotData.forEach(function (s) {
      const offset = -SPIN * s.phase;
      // sweep in step with the ball
      gsap.to(s.orbit, {
        rotation: 360,
        duration: SPIN,
        ease: "none",
        repeat: -1,
        delay: offset
      });
      // near side reads bigger and brighter than far side
      gsap.to(s.dot, {
        scale: s.size * 1.9,
        duration: SPIN / 2,
        ease: "sine.inOut",
        yoyo: true,
        repeat: -1,
        delay: offset
      });
      gsap.to(s.dot, {
        opacity: 0.1 + Math.random() * 0.35,
        duration: 0.6 + Math.random() * 1.6,
        ease: "sine.inOut",
        yoyo: true,
        repeat: -1,
        delay: Math.random() * 2
      });
    });

    gsap.to("#halo", {
      opacity: 0.55,
      duration: 2.4,
      ease: "sine.inOut",
      yoyo: true,
      repeat: -1
    });
    gsap.to(beamHost, {
      opacity: 0.55,
      duration: 1.9,
      ease: "sine.inOut",
      yoyo: true,
      repeat: -1
    });
  }

  /* ---------- fit to viewport ---------- */
  const scene = document.getElementById("scene");
  function fit() {
    const s = Math.min(1.15, Math.max(0.42, Math.min(window.innerWidth / 760, window.innerHeight / 620)));
    gsap.set(scene, { scale: s });
  }
  fit();
  window.addEventListener("resize", fit);
})();
</script>
</body>
</html>
