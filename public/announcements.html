<!doctype html>
<html lang="en" data-theme="upside">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint (initTheme() re-validates it later)
			try { var _t = localStorage.getItem("cowriteTheme"); if (_t) document.documentElement.setAttribute("data-theme", _t); var _f = localStorage.getItem("cowriteFont"); if (_f) document.documentElement.setAttribute("data-font", _f) } catch (e) {}
		</script>
		<title>{{SITE_NAME}}: Announcements</title>
		<link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Inconsolata:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tiny5&family=Jersey+15&display=swap"
			rel="stylesheet"
		/>
		<script src="https://kit.fontawesome.com/60a456108b.js" crossorigin="anonymous"></script>
		<link rel="stylesheet" href="/css/base.css" />
	</head>
	<body>
		<div class="wrap">
			<div class="archive-inner">
				<div class="archive-head">
					<a class="ghost" href="/dashboard" style="text-decoration: none; padding: 10px 16px; border-radius: 12px">← Back</a>
					<h2>📣 Announcements</h2>
				</div>
				<p class="subtle" style="text-align: left; margin: 0 0 14px">News from the {{SITE_NAME}} admins, new features, changes, and the occasional plea for patience.</p>
				<div id="annCompose" class="hidden"></div>
				<div id="annList"><p class="subtle" style="text-align:left">Loading…</p></div>
			</div>
		</div>

		<script type="module">
			import { api } from "/js/api.js"
			import { requireAuth } from "/js/auth-guard.js"
			import { mountChrome, setUserChip } from "/js/chrome.js"
			import { postListHtml, composerHtml, imageRowHtml, readImages } from "/js/announcements-view.js"

			mountChrome({ page: "announcements" })
			const me = await requireAuth()
			setUserChip(me)
			const $ = (id) => document.getElementById(id)

			// The composer only ever exists for an admin: the server says who
			// that is (it's the same flag it enforces on the write routes).
			let admin = false
			async function load() {
				const d = await api("/api/announcements", null, "GET")
				admin = !!d.admin
				$("annList").innerHTML = postListHtml(d.posts, { admin })
				if (admin && !$("annComposer")) {
					$("annCompose").innerHTML = composerHtml()
					$("annCompose").classList.remove("hidden")
				}
			}
			await load()

			// The markdown goes up as typed; the server renders and sanitizes
			// it (lib/markdown.js + sanitizeRich) — that is the trust boundary.
			document.addEventListener("click", async (e) => {
				if (e.target.id !== "annPost") return
				const btn = e.target
				btn.disabled = true
				try {
					await api("/api/admin/announcements", { markdown: $("annEditor").value, images: readImages($("annComposer")) })
					$("annEditor").value = ""
					await load()
				} catch (err) {
					alert(err.message || "That didn't post.")
				}
				btn.disabled = false
			})
			// Image urls: + adds a row, ✕ removes one.
			document.addEventListener("click", (e) => {
				const add = e.target.closest("[data-ann-add]")
				if (add) {
					const rows = add.closest(".ann-imgs").querySelector(".ann-imgs-rows")
					rows.insertAdjacentHTML("beforeend", imageRowHtml())
					rows.lastElementChild.querySelector("input").focus()
					return
				}
				const rm = e.target.closest(".ann-img-rm")
				if (rm) rm.closest(".ann-img-row").remove()
			})
			// Post to Discord: the server sends the post's markdown to the admin
			// channel (POST /api/admin/announcements/:id/discord, bot token + channel
			// id are Replit secrets — see src/discord.js).
			document.addEventListener("click", async (e) => {
				const b = e.target.closest("[data-ann-discord]")
				if (!b) return
				b.disabled = true
				const was = b.textContent
				try {
					await api(`/api/admin/announcements/${encodeURIComponent(b.dataset.annDiscord)}/discord`, {})
					b.textContent = "Posted to Discord ✓"
				} catch (err) {
					b.disabled = false
					b.textContent = "✗ " + (err.message || "Discord didn't take it.")
					setTimeout(() => { b.textContent = was }, 5000)
				}
			})
			// Edit in place: unfold the post's own markdown, Save PUTs it and the
			// list reloads with the re-rendered html; Cancel just folds it.
			document.addEventListener("click", async (e) => {
				const ed = e.target.closest("[data-ann-edit]")
				if (ed) {
					const box = document.querySelector(`[data-ann-editbox="${ed.dataset.annEdit}"]`)
					box?.classList.toggle("hidden")
					if (box && !box.classList.contains("hidden")) box.querySelector("textarea")?.focus()
					return
				}
				const cancel = e.target.closest("[data-ann-cancel]")
				if (cancel) return document.querySelector(`[data-ann-editbox="${cancel.dataset.annCancel}"]`)?.classList.add("hidden")
				const save = e.target.closest("[data-ann-save]")
				if (!save) return
				const id = save.dataset.annSave
				const ta = document.querySelector(`[data-ann-editor="${id}"]`)
				save.disabled = true
				try {
					await api(`/api/admin/announcements/${encodeURIComponent(id)}`, { markdown: ta?.value ?? "", images: readImages(document.querySelector(`[data-ann-imgs="${id}"]`) || document) }, "PUT")
					await load()
				} catch (err) {
					save.disabled = false
					alert(err.message || "That didn't save.")
				}
			})
			document.addEventListener("click", async (e) => {
				const b = e.target.closest("[data-ann-delete]")
				if (!b) return
				if (!window.confirm("Delete this announcement for everyone?")) return
				b.disabled = true
				try {
					await api(`/api/admin/announcements/${encodeURIComponent(b.dataset.annDelete)}`, null, "DELETE")
					await load()
				} catch (err) {
					b.disabled = false
					alert(err.message || "That didn't work.")
				}
			})
		</script>
	</body>
</html>
