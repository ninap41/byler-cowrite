<!doctype html>
<html lang="en" data-theme="neon">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint (initTheme() re-validates it later)
			try { var _t = localStorage.getItem("cowriteTheme"); if (_t) document.documentElement.setAttribute("data-theme", _t) } catch (e) {}
		</script>
		<title>Byler Cowrite — Inbox</title>
		<link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Inconsolata:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/base.css" />
		<link rel="stylesheet" href="/css/dashboard.css" />
	</head>
	<body>
		<div class="wrap">
			<div class="archive-inner">
				<div class="archive-head">
					<a class="ghost" href="/dashboard" style="text-decoration: none; padding: 10px 16px; border-radius: 12px">← Back</a>
					<h2>📬 Inbox <span class="badge-chip hidden" id="inboxUnread"></span></h2>
				</div>
				<!-- Mark-all-read sits with the description, not up in the head row:
				     the topbar's own controls live in that corner. -->
				<div class="row" style="align-items: center; margin: 0 0 14px; gap: 12px">
					<p class="subtle" style="text-align: left; margin: 0; flex: 1 1 220px">
						Friend requests, game invites and notes from other writers. Every message, newest first.
					</p>
					<button class="ghost hidden" id="inboxReadAll" style="flex: 0 0 auto">Mark all read</button>
				</div>

				<div class="card">
					<div id="inboxList"></div>
				</div>
			</div>
		</div>

		<script src="/socket.io/socket.io.js"></script>
		<script type="module">
			import { getToken } from "/js/api.js"
			import { mountChrome } from "/js/chrome.js"
			import { requireAuth } from "/js/auth-guard.js"
			import { mountInbox } from "/js/inbox-panel.js"

			mountChrome({ page: "inbox" })
			const $ = (id) => document.getElementById(id)
			await requireAuth("/")

			// The whole inbox — no limit, same rows and actions as the dashboard's
			// preview, because they're the same module.
			const panel = mountInbox({
				list: $("inboxList"),
				unreadChip: $("inboxUnread"),
				readAllBtn: $("inboxReadAll"),
			})
			panel.reload()

			// Presence + live nudges: a new message should land without a refresh.
			const socket = io()
			socket.on("connect", () => socket.emit("identify", { auth: getToken() }))
			socket.on("inbox", () => panel.reload())
			setInterval(() => panel.reload(), 20000)
		</script>
	</body>
</html>
