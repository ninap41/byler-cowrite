<!doctype html>
<html lang="en" data-theme="upside">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint (initTheme() re-validates it later)
			try { var _t = localStorage.getItem("cowriteTheme"); if (_t) document.documentElement.setAttribute("data-theme", _t); var _f = localStorage.getItem("cowriteFont"); if (_f) document.documentElement.setAttribute("data-font", _f) } catch (e) {}
		</script>
		<title>{{SITE_NAME}}: Inbox</title>
		<link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Inconsolata:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tiny5&family=Jersey+15&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/vendor/fontawesome/css/fa.min.css" />
		<link rel="stylesheet" href="/css/base.css" />
		<link rel="stylesheet" href="/css/dashboard.css" />
	</head>
	<body>
		<div class="wrap">
			<div class="archive-inner wide ib-page">
				<div class="archive-head ib-head">
					<a class="ghost" href="/dashboard" style="text-decoration: none; padding: 10px 16px; border-radius: 12px">← Back</a>
					<h2>📬 Inbox <span class="badge-chip ib-new hidden" id="inboxUnread"></span></h2>
					<button class="ghost hidden ib-readall" id="inboxReadAll">Mark all read</button>
				</div>
				<!-- kinds of message; each chip counts its conversations -->
				<div class="ib-filters" id="inboxFilters" role="tablist"></div>
				<!-- appears while any conversation is ticked -->
				<div class="ib-bulk hidden" id="inboxBulk"></div>

				<!-- the list beside the reading pane; under 860px the list is the
				     page and an opened conversation covers it (.ib-reading) -->
				<div class="ib-shell">
					<div class="ib-list" id="inboxList"></div>
					<div class="ib-pane" id="inboxPane"></div>
				</div>
			</div>
		</div>

		<script src="/socket.io/socket.io.js"></script>
		<script type="module" src="/js/pages/inbox.js"></script>
	</body>
</html>
