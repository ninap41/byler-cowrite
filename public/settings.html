<!doctype html>
<html lang="en" data-theme="upside">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint (initTheme() re-validates it later)
			try { var _t = localStorage.getItem("cowriteTheme"); if (_t) document.documentElement.setAttribute("data-theme", _t); var _f = localStorage.getItem("cowriteFont"); if (_f) document.documentElement.setAttribute("data-font", _f) } catch (e) {}
		</script>
		<script>
			// Pre-hide animated containers before first paint so the GSAP entrance
			// can never flash them visible and restart (the double-glitch). The
			// entrance script lifts this; the timer is the no-GSAP safety net.
			if (!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) {
				document.documentElement.classList.add("pre-anim")
				setTimeout(function () { document.documentElement.classList.remove("pre-anim") }, 1500)
			}
		</script>
		<title>{{SITE_NAME}}: Settings</title>
		<link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Inconsolata:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tiny5&family=Jersey+15&display=swap"
			rel="stylesheet"
		/>
		<script src="https://kit.fontawesome.com/60a456108b.js" crossorigin="anonymous"></script>
		<link rel="stylesheet" href="/css/base.css" />
		<link rel="stylesheet" href="/css/dashboard.css" />
	</head>
	<body>
		<div class="wrap">
			<h1>{{SITE_NAME}}</h1>
			<p class="tag">A round-robin writing game. Write byler fan fiction together</p>

			<div class="main" style="max-width: 640px">
				<div class="card">
					<h3 class="dash-h" style="margin-top: 0">Settings</h3>

					<!-- color first: the thing people change most -->
					<div class="settings-section">
						<label>Your username color</label>
						<div class="swatches" id="swatches"></div>
					</div>

					<!-- membership: the signup checkbox, changeable here; saves on toggle -->
					<div class="settings-section">
						<label class="checkline" style="margin: 2px 0 0">
							<input type="checkbox" id="setMember" />
							I am a member of Byler Offscreen
						</label>
					</div>

					<!-- sounds: saved on the account so they follow you between sessions -->
					<div class="settings-section">
						<button type="button" class="ghost sec-toggle" data-toggle="secSounds" aria-expanded="false">
							🔊 Sounds <i class="chev">&#9662;</i>
						</button>
						<div id="secSounds" class="sec-body hidden">
							<label class="checkline" style="margin: 2px 0 0">
								<input type="checkbox" id="sndChat" />
								Chat pings
							</label>
							<label class="checkline" style="margin: 9px 0 0">
								<input type="checkbox" id="sndStory" />
								Story chimes (new lines)
							</label>
							<label class="checkline" style="margin: 9px 0 0">
								<input type="checkbox" id="sndClock" />
								Vecna clock (end-of-turn countdown)
							</label>
							<label class="checkline" style="margin: 9px 0 0">
								<input type="checkbox" id="sndGimmick" />
								Gimmick sounds
							</label>
						</div>
					</div>

					<!-- account details: collapsed behind toggles to keep the page calm -->
					<div class="settings-section">
						<button type="button" class="ghost sec-toggle" data-toggle="secUsername" aria-expanded="false">
							✏️ Change username <i class="chev">&#9662;</i>
						</button>
						<div id="secUsername" class="sec-body hidden">
							<label for="setUsername">Username</label>
							<input id="setUsername" maxlength="24" autocomplete="username" />
							<div class="row"><button class="ghost" id="saveUsername">Save username</button></div>
						</div>

						<button type="button" class="ghost sec-toggle" data-toggle="secEmail" aria-expanded="false">
							📧 Change email <i class="chev">&#9662;</i>
						</button>
						<div id="secEmail" class="sec-body hidden">
							<label for="setEmail">Email</label>
							<input id="setEmail" type="email" autocomplete="email" />
							<label for="emailPass">Confirm with your password</label>
							<input id="emailPass" type="password" autocomplete="current-password" />
							<div class="row"><button class="ghost" id="saveEmail">Save email</button></div>
						</div>

						<button type="button" class="ghost sec-toggle" data-toggle="secPass" aria-expanded="false">
							🔒 Change password <i class="chev">&#9662;</i>
						</button>
						<div id="secPass" class="sec-body hidden">
							<label for="oldPass">Current password</label>
							<input id="oldPass" type="password" autocomplete="current-password" />
							<label for="newPass">New password (min 4 characters)</label>
							<input id="newPass" type="password" autocomplete="new-password" />
							<div class="row"><button class="ghost" id="savePass">Change password</button></div>
							<p class="subtle" style="text-align: left; margin: 8px 0 0; font-size: 0.78rem">
								Changing your password signs you out everywhere else.
							</p>
						</div>
					</div>

					<div class="settings-section">
						<label for="setAvatar">Profile picture (external image link)</label>
						<input id="setAvatar" placeholder="https://…/me.png" />
						<label for="setAvatarFit" style="margin-top: 10px">Picture fit</label>
						<select id="setAvatarFit" class="ghost" style="width: 100%">
							<option value="cover">Crop to fill the circle</option>
							<option value="contain">Zoom out to fit the whole image</option>
						</select>
						<label for="setAbout" style="margin-top: 10px">About you (shown on your public profile)</label>
						<textarea id="setAbout" maxlength="2000" rows="5" style="width: 100%; resize: vertical"></textarea>
						<p class="subtle" style="text-align: left; margin: 6px 0 0; font-size: 0.78rem">
							Embed images inline with <code>&lt;img src="https://…"&gt;</code>, other html shows as plain text.
						</p>
						<label style="margin-top: 10px">Links (up to three)</label>
						<div id="linkChips" class="tag-chips"></div>
						<div class="row" style="justify-content: flex-start; margin-top: 8px">
							<button type="button" class="ghost" id="addLinkBtn">Add link +</button>
							<span class="subtle hidden" id="linkMax" style="font-size: 0.78rem">3 links max: remove one to add another.</span>
						</div>
						<!-- the save button ends the profile form -->
						<div class="row"><button class="primary" id="saveProfile">Save profile</button></div>
					</div>

					<div class="err" id="setErr"></div>
					<p class="ok-msg" id="setOk"></p>
				</div>
			</div>
		</div>

		<!-- Add-link modal: the site's .confirm-modal shape (see confirm-delete.js) -->
		<div class="confirm-modal hidden" id="linkModal" role="dialog" aria-modal="true" aria-labelledby="linkModalTitle">
			<div class="confirm-card">
				<h3 id="linkModalTitle">Add a link</h3>
				<label for="linkLabel">Label</label>
				<input id="linkLabel" placeholder="My AO3" maxlength="40" style="width: 100%" />
				<label for="linkUrl" style="margin-top: 10px">URL</label>
				<input id="linkUrl" placeholder="https://…" style="width: 100%" />
				<div class="err" id="linkErr"></div>
				<div class="row" style="justify-content: flex-end; margin-top: 12px">
					<button type="button" class="ghost" id="linkCancel">Cancel</button>
					<button type="button" class="primary" id="linkAdd">Add link</button>
				</div>
			</div>
		</div>

		<script type="module">
			import { api } from "/js/api.js"
			import { mountChrome, setUserChip } from "/js/chrome.js"
			import { requireAuth } from "/js/auth-guard.js"
			import { PALETTE, safeColor } from "/js/util.js"

			mountChrome({ page: "settings" })
			const $ = (id) => document.getElementById(id)
			let me = await requireAuth("/")

			// Collapsible account sections — one open at a time keeps the page calm.
			const toggles = [...document.querySelectorAll(".sec-toggle")]
			toggles.forEach((btn) => {
				btn.onclick = () => {
					const body = $(btn.dataset.toggle)
					const opening = body.classList.contains("hidden")
					toggles.forEach((b) => {
						$(b.dataset.toggle).classList.add("hidden")
						b.setAttribute("aria-expanded", "false")
					})
					if (opening) {
						body.classList.remove("hidden")
						btn.setAttribute("aria-expanded", "true")
						body.querySelector("input")?.focus()
					}
				}
			})

			const say = (ok, msg) => {
				$("setErr").textContent = ok ? "" : msg
				$("setOk").textContent = ok ? msg : ""
			}
			// The stored About is server-sanitized html; turn it back into the
			// editable source (plain <img src="…"> tags, entities unescaped).
			const aboutSource = (html) =>
				String(html || "")
					.replace(/<img class="about-img" src="(.*?)" alt="" loading="lazy">/g, '<img src="$1">')
					.replace(/&lt;/g, "<")
					.replace(/&gt;/g, ">")
					.replace(/&quot;/g, '"')
					.replace(/&#39;/g, "'")
					.replace(/&amp;/g, "&")
			// Profile links live in this array; chips render from it and the ✕
			// splices it (the tag-chips pattern). Save profile persists the array.
			let links = []
			function renderLinks() {
				const box = $("linkChips")
				box.innerHTML = ""
				links.forEach((l, i) => {
					const chip = document.createElement("span")
					chip.className = "tag-chip"
					chip.append("🔗 " + (l.label || l.url))
					chip.title = l.url
					const x = document.createElement("button")
					x.type = "button"
					x.textContent = "✕"
					x.setAttribute("aria-label", "Remove link " + (l.label || l.url))
					x.onclick = () => {
						links.splice(i, 1)
						renderLinks()
					}
					chip.appendChild(x)
					box.appendChild(chip)
				})
				const full = links.length >= 3
				$("addLinkBtn").classList.toggle("hidden", full)
				$("linkMax").classList.toggle("hidden", !full)
			}

			// The add-link modal (the site's .confirm-modal shape).
			const linkModal = $("linkModal")
			const openLinkModal = () => {
				$("linkLabel").value = $("linkUrl").value = ""
				$("linkErr").textContent = ""
				linkModal.classList.remove("hidden")
				$("linkLabel").focus()
			}
			const closeLinkModal = () => linkModal.classList.add("hidden")
			$("addLinkBtn").onclick = openLinkModal
			$("linkCancel").onclick = closeLinkModal
			linkModal.addEventListener("click", (e) => {
				if (e.target === linkModal) closeLinkModal()
			})
			linkModal.addEventListener("keydown", (e) => {
				if (e.key === "Escape") closeLinkModal()
				if (e.key === "Enter") $("linkAdd").click()
			})
			$("linkAdd").onclick = () => {
				const label = $("linkLabel").value.trim()
				const url = $("linkUrl").value.trim()
				if (!/^https?:\/\//i.test(url)) {
					$("linkErr").textContent = "Links must start with http:// or https://."
					return
				}
				if (links.length >= 3) return closeLinkModal()
				links.push({ label: label || url.slice(0, 40), url })
				renderLinks()
				closeLinkModal()
				say(true, "Link added: hit Save profile to keep it.")
			}

			function fill() {
				if (!me) return
				setUserChip(me)
				$("setUsername").value = me.username
				$("setEmail").value = me.email
				$("setAvatar").value = me.avatar || ""
				$("setAvatarFit").value = me.avatarFit === "contain" ? "contain" : "cover"
				$("setAbout").value = aboutSource(me.about)
				const snd = typeof me.sounds === "object" && me.sounds !== null ? me.sounds : {}
				$("sndChat").checked = snd.chat !== false
				$("sndStory").checked = snd.story !== false
				$("sndClock").checked = snd.clock !== false
				$("sndGimmick").checked = snd.gimmick !== false
				$("setMember").checked = me.isAMemberOfBylerOffscreen === true
				links = (me.links || []).map((l) => ({ label: l.label || "", url: l.url || "" }))
				renderLinks()
				document.querySelectorAll(".swatch").forEach((x) => x.classList.toggle("sel", x.dataset.color === safeColor(me.color)))
			}

			const sw = $("swatches")
			PALETTE.forEach((c) => {
				const d = document.createElement("div")
				d.className = "swatch"
				d.style.background = c
				d.dataset.color = c
				d.onclick = () =>
					api("/api/account/color", { color: c })
						.then((r) => {
							me = { ...me, ...r.user }
							fill()
							say(true, "Color saved.")
						})
						.catch((e) => say(false, e.message))
				sw.appendChild(d)
			})

			$("setMember").onchange = async () => {
				try {
					const r = await api("/api/account/membership", { isAMemberOfBylerOffscreen: $("setMember").checked })
					me = { ...me, ...r.user }
					say(true, $("setMember").checked ? "Marked as a Byler Offscreen member." : "Membership unmarked.")
				} catch (e) {
					say(false, e.message)
				}
			}

			// Sounds save the moment a box is toggled — no separate save button.
			for (const id of ["sndChat", "sndStory", "sndClock", "sndGimmick"])
				$(id).onchange = async () => {
					try {
						const r = await api("/api/account/sounds", {
							chat: $("sndChat").checked,
							story: $("sndStory").checked,
							clock: $("sndClock").checked,
							gimmick: $("sndGimmick").checked,
						})
						me = { ...me, ...r.user }
						say(true, "Sound settings saved.")
					} catch (e) {
						say(false, e.message)
					}
				}

			$("saveUsername").onclick = async () => {
				try {
					const r = await api("/api/account/username", { username: $("setUsername").value.trim() })
					me = { ...me, ...r.user }
					fill()
					say(true, "Username saved.")
				} catch (e) {
					say(false, e.message)
				}
			}
			$("saveProfile").onclick = async () => {
				try {
					const r = await api("/api/account/profile", {
						about: $("setAbout").value,
						links,
						avatar: $("setAvatar").value.trim(),
						avatarFit: $("setAvatarFit").value,
					})
					me = { ...me, ...r.user }
					fill()
					say(true, "Profile saved.")
				} catch (e) {
					say(false, e.message)
				}
			}
			$("saveEmail").onclick = async () => {
				try {
					const r = await api("/api/account/email", { email: $("setEmail").value.trim(), password: $("emailPass").value })
					me = { ...me, ...r.user }
					$("emailPass").value = ""
					fill()
					say(true, "Email saved.")
				} catch (e) {
					say(false, e.message)
				}
			}
			$("savePass").onclick = async () => {
				try {
					await api("/api/account/password", { oldPassword: $("oldPass").value, newPassword: $("newPass").value })
					$("oldPass").value = $("newPass").value = ""
					say(true, "Password changed: other devices were signed out.")
				} catch (e) {
					say(false, e.message)
				}
			}
			fill()
		</script>
		<script src="/vendor/gsap.min.js"></script>
		<script type="module">
			;(function () {
				var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches
				if (typeof gsap === "undefined" || reduce || document.visibilityState === "hidden") {
					document.documentElement.classList.remove("pre-anim")
					return
				}
				// the tweens below apply their from-states this same tick, so lifting
				// the pre-paint hide here can never flash the finished layout
				document.documentElement.classList.remove("pre-anim")
				// recover from a stagger frozen by a background tab: on refocus,
				// force any still-hidden card to its final state
				document.addEventListener("visibilitychange", function () {
					if (document.visibilityState === "visible")
						setTimeout(function () {
							gsap.set(".card", { clearProps: "opacity,transform" })
						}, 900)
				})
				gsap.fromTo("h1", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" })
				gsap.fromTo(".card", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power2.out", clearProps: "transform,opacity" })
			})()
		</script>
	</body>
</html>
