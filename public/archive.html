<!doctype html>
<html lang="en" data-theme="neon">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint (initTheme() re-validates it later)
			try { var _t = localStorage.getItem("cowriteTheme"); if (_t) document.documentElement.setAttribute("data-theme", _t); var _f = localStorage.getItem("cowriteFont"); if (_f) document.documentElement.setAttribute("data-font", _f) } catch (e) {}
		</script>
		<title>{{SITE_NAME}}: Previous Games</title>
		<link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Inconsolata:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tiny5&family=Jersey+15&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/base.css" />
	</head>
	<body>
		<div class="wrap">
			<div class="archive-inner">
				<div class="archive-head">
					<a class="ghost" href="/dashboard" id="archiveBack" style="text-decoration: none; padding: 10px 16px; border-radius: 12px">← Back</a>
					<h2>Previous Games</h2>
				</div>
				<!-- how many covers per row: the same picker, and the same saved
				     choice, as the all-stories shelf. Its own row, not the head
				     the head's right-hand corner belongs to the fixed topbar. -->
				<div class="arch-tools"><span id="archViewWrap"></span></div>
				<p class="hidden" id="archNotice" style="color: var(--good); text-align: left; margin: 0 0 12px"></p>
				<div id="archiveList"></div>
				<div id="archiveDetail" class="hidden">
					<!-- title · authors · info, then the prompt, tags, and the story -->
					<h2 id="archTitle" style="text-align: left; margin: 0 0 4px"></h2>
					<p id="archAuthors" class="subtle" style="text-align: left; margin: 0 0 4px"></p>
					<p class="gc-meta" id="archMeta" style="margin: 0 0 14px; align-items: center"></p>
					<div class="prompt-banner" id="archPrompt"></div>
					<!-- tumblr-style tags: type + Enter to add a #chip; saves as you go -->
					<div id="archTags"></div>
					<p class="err" id="archTagsErr" style="margin: 4px 0 0"></p>
					<div class="story" id="archStory" style="max-height: none"></div>
					<div class="row">
						<button class="primary" id="archContinue">Continue this story →</button>
						<button class="ghost danger hidden" id="archDelete">🗑 Delete story…</button>
					</div>
					<p class="subtle" style="text-align: left; margin-top: 12px">
						<a href="#" class="linky" id="archListLink">← All previous games</a>
					</p>
				</div>
			</div>
		</div>

		<!-- delete confirmation (with a last chance to save a copy) -->
		<div class="confirm-modal hidden" id="delModal">
			<div class="confirm-card">
				<h3>Delete “<span id="delName"></span>”?</h3>
				<p class="subtle" style="text-align: left">
					This permanently removes the story and its code, for every writer in it. Maybe keep a copy first?
				</p>
				<div class="row">
					<button class="ghost" id="delHtml">⬇ Download .html</button>
					<button class="ghost" id="delPdf">⬇ Download .pdf</button>
				</div>
				<div class="row">
					<button class="ghost" id="delCancel">Cancel</button>
					<button class="primary danger" id="delConfirm">Delete forever</button>
				</div>
				<div class="err" id="delErr"></div>
			</div>
		</div>

		<script type="module">
			import { api } from "/js/api.js"
			import { mountChrome, setUserChip } from "/js/chrome.js"
			import { requireAuth } from "/js/auth-guard.js"
			import { gameCardHtml, archiveStoryHtml, fmtWhen, canContinue } from "/js/archive-view.js"
			import { mountViewPicker, applyGrid } from "/js/components/view-picker.js"
			import { safeColor, oneLinePrompt, promptHtml } from "/js/util.js"
			import { buildExports, exportDocument } from "/js/export.js"
			import { mountTagEditor } from "/js/components/tag-chips.js"

			mountChrome({ page: "archive" })
			const me = await requireAuth("/")
			setUserChip(me)
			const $ = (id) => document.getElementById(id)
			const hasGsap =
				typeof window.gsap !== "undefined" &&
				!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)

			function showList() {
				$("archiveDetail").classList.add("hidden")
				$("archiveList").classList.remove("hidden")
				history.replaceState(null, "", "/archive")
			}

			// ---- layout ----
			// List or N-across, shared with the all-stories shelf (same picker, same
			// stored choice). The two group headings stay OUTSIDE the grids — a
			// heading is not a card and must not take a column — so each group gets
			// its own container and the grid class lands there.
			let cardCols = 1
			mountViewPicker(document.getElementById("archViewWrap"), (cols) => {
				cardCols = cols
				document.querySelector(".archive-inner").classList.toggle("wide", cols > 1)
				$("archiveList")
					.querySelectorAll(".arch-group")
					.forEach((box) => applyGrid(box, cols))
			})

			function renderGameCards(games) {
				const list = $("archiveList")
				if (!games.length) {
					list.innerHTML =
						'<p class="archive-empty">No saved games yet, finish (or pause) a game and it will show up here.</p>'
					return
				}
				list.innerHTML = ""
				// grouped: the games I host first, then the ones I joined
				;[
					["Hosted games", games.filter((g) => g.hosted)],
					["Joined games", games.filter((g) => !g.hosted)],
				].forEach(([title, group]) => {
					if (!group.length) return
					const h = document.createElement("h4")
					h.className = "arch-sub"
					h.textContent = title
					list.appendChild(h)
					const box = document.createElement("div")
					box.className = "arch-group"
					applyGrid(box, cardCols)
					list.appendChild(box)
					group.forEach((g) => appendCard(g, box))
				})
				function appendCard(g, box) {
					const b = document.createElement("div")
					b.className = "game-card"
					b.style.cursor = "pointer"
					b.innerHTML = gameCardHtml(g)
					// the host alone may continue; everyone else just reads
					if (canContinue(g, me?.username)) {
						const cont = document.createElement("button")
						cont.className = "primary"
						cont.textContent = "Continue →"
						cont.style.cssText = "margin-top:10px;flex:none;min-width:0;padding:8px 14px;font-size:.85rem"
						cont.onclick = (e) => {
							e.stopPropagation()
							location.href = "/game?code=" + encodeURIComponent(g.code)
						}
						b.appendChild(cont)
					}
					b.onclick = () => openGameDetail(g.code)
					box.appendChild(b)
					if (window.gsap && hasGsap)
						gsap.from(b, { opacity: 0, y: 18, duration: 0.45, delay: 0.05 * box.children.length, ease: "power2.out" })
				}
			}

			let curG = null
			async function openGameDetail(code) {
				let g
				try {
					g = await api("/api/games/" + encodeURIComponent(code), null, "GET")
				} catch (e) {
					return
				}
				curG = g
				$("archTitle").textContent = g.name || oneLinePrompt(g.prompt) || g.code
				// every writer, linked to their profile (host first, crown kept)
				const authors = $("archAuthors")
				authors.textContent = ""
				;[...g.writers].sort((a, b) => b.isHost - a.isHost).forEach((w, i) => {
					if (i) authors.append(", ")
					const a = document.createElement("a")
					a.className = "linky"
					a.href = "/profile?user=" + encodeURIComponent(w.name)
					a.style.color = safeColor(w.color)
					a.textContent = (w.isHost ? "👑 " : "") + w.name
					authors.appendChild(a)
				})
				$("archMeta").textContent = `code: ${g.code} · last played · ${fmtWhen(g.savedAt)}`
				$("archPrompt").innerHTML = promptHtml(g.prompt || "(no prompt)")
				// tags: everyone with a seat here may edit; each change saves itself
				mountTagEditor($("archTags"), {
					tags: g.tags || [],
					onSave: async (tags) => {
						try {
							await api("/api/games/" + encodeURIComponent(g.code) + "/tags", { tags })
							$("archTagsErr").textContent = ""
						} catch (e) {
							$("archTagsErr").textContent = e.message
						}
					},
				})
				// story html was sanitized server-side by sanitizeRich() before being saved
				$("archStory").innerHTML = archiveStoryHtml(g.story)
				const mayContinue = canContinue(g, me?.username)
				$("archContinue").classList.toggle("hidden", !mayContinue)
				$("archContinue").onclick = () => (location.href = "/game?code=" + encodeURIComponent(g.code))
				$("archDelete").classList.toggle("hidden", g.hostName !== me.username)
				$("archiveList").classList.add("hidden")
				const det = $("archiveDetail")
				det.classList.remove("hidden")
				history.replaceState(null, "", "/archive?code=" + encodeURIComponent(g.code))
				if (window.gsap && hasGsap)
					gsap.fromTo(det, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" })
			}

			$("archListLink").onclick = (e) => {
				e.preventDefault()
				showList()
			}

			// ---- delete flow: confirm modal with a last-chance export ----
			const exportDoc = () => exportDocument(buildExports(curG.prompt || "", curG.story || []).html)
			$("archDelete").onclick = () => {
				$("delName").textContent = curG.name || oneLinePrompt(curG.prompt) || curG.code
				$("delErr").textContent = ""
				$("delModal").classList.remove("hidden")
			}
			$("delCancel").onclick = () => $("delModal").classList.add("hidden")
			$("delModal").addEventListener("click", (e) => {
				if (e.target === $("delModal")) $("delModal").classList.add("hidden")
			})
			$("delHtml").onclick = () => {
				const blob = new Blob([exportDoc()], { type: "text/html" })
				const a = document.createElement("a")
				a.href = URL.createObjectURL(blob)
				a.download = "byler-cowrite-" + curG.code + ".html"
				a.click()
				URL.revokeObjectURL(a.href)
			}
			// Lazy-load jsPDF only when someone actually asks for a PDF.
			let jsPdfPromise = null
			const loadJsPdf = () =>
				(jsPdfPromise ??= new Promise((res, rej) => {
					if (window.jspdf) return res(window.jspdf)
					const s = document.createElement("script")
					s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
					s.onload = () => res(window.jspdf)
					s.onerror = () => {
						jsPdfPromise = null
						rej(new Error("Could not load the PDF library."))
					}
					document.head.appendChild(s)
				}))
			function storyToPdf(jspdf, prompt, story, code) {
				const doc = new jspdf.jsPDF({ unit: "pt", format: "a4" })
				const M = 64,
					W = doc.internal.pageSize.getWidth() - M * 2,
					BOTTOM = doc.internal.pageSize.getHeight() - M
				let y = M
				const tmp = document.createElement("div")
				const put = (text, size, style, align) => {
					doc.setFont("times", style)
					doc.setFontSize(size)
					const lh = size * 1.55
					for (const ln of doc.splitTextToSize(text, W)) {
						if (y + lh > BOTTOM) {
							doc.addPage()
							y = M
						}
						const x = align === "center" ? M + W / 2 : align === "right" ? M + W : M
						doc.text(ln, x, y, { align: align || "left" })
						y += lh
					}
				}
				if (prompt) {
					put(prompt, 13, "italic")
					y += 10
				}
				for (const l of story) {
					const html = l.html || ""
					const m = /^<(h1|h2|h3|p|hr)( class="(al-c|al-r)")?[ >]/.exec(html)
					const tag = m?.[1] || "p"
					const align = m?.[3] === "al-c" ? "center" : m?.[3] === "al-r" ? "right" : "left"
					if (tag === "hr") {
						if (y + 20 > BOTTOM) {
							doc.addPage()
							y = M
						}
						doc.setDrawColor(180)
						doc.line(M, y, M + W, y)
						y += 20
						continue
					}
					tmp.innerHTML = html.replace(/<br\s*\/?>/g, "\n")
					const text = tmp.textContent.trim()
					if (!text) continue
					const size = tag === "h1" ? 22 : tag === "h2" ? 18 : tag === "h3" ? 15 : 12
					put(text, size, tag === "p" ? "normal" : "bold", align)
					y += 8
				}
				doc.save("byler-cowrite-" + code + ".pdf")
			}
			$("delPdf").onclick = async () => {
				$("delErr").textContent = ""
				try {
					storyToPdf(await loadJsPdf(), curG.prompt || "", curG.story || [], curG.code)
				} catch (e) {
					// offline / CDN blocked: fall back to the browser's print-to-PDF
					const w = window.open("", "_blank")
					if (!w) return ($("delErr").textContent = e.message)
					w.document.write(exportDoc())
					w.document.close()
					w.focus()
					w.print()
				}
			}
			$("delConfirm").onclick = async () => {
				try {
					const title = curG.name || oneLinePrompt(curG.prompt) || curG.code
					await api("/api/games/" + encodeURIComponent(curG.code), null, "DELETE")
					$("delModal").classList.add("hidden")
					showList()
					// refresh the list without the deleted story + confirm it's gone
					try {
						renderGameCards(await api("/api/games", null, "GET"))
					} catch (e) {}
					const note = $("archNotice")
					note.textContent = `🗑 “${title}” was deleted.`
					note.classList.remove("hidden")
					setTimeout(() => note.classList.add("hidden"), 6000)
					// and an unmissable centered confirmation
					const pop = document.createElement("div")
					pop.className = "badge-pop show"
					const b = document.createElement("b")
					b.textContent = "🗑 Story deleted"
					const s = document.createElement("span")
					s.textContent = `“${title}” is gone: for everyone, forever.`
					pop.append(b, s)
					document.body.appendChild(pop)
					setTimeout(() => pop.classList.add("gone"), 3600)
					setTimeout(() => pop.remove(), 4300)
				} catch (e) {
					$("delErr").textContent = e.message
				}
			}

			if (me) {
				$("archiveList").innerHTML = '<p class="archive-empty">Loading…</p>'
				try {
					const games = await api("/api/games", null, "GET")
					renderGameCards(games)
					const code = new URLSearchParams(location.search).get("code")
					if (code) openGameDetail(code.toUpperCase())
				} catch (e) {
					$("archiveList").innerHTML = '<p class="archive-empty">Could not load saved games.</p>'
				}
			}
		</script>
		<script src="/vendor/gsap.min.js"></script>
	</body>
</html>
