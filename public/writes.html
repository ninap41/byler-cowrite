<!doctype html>
<html lang="en" data-theme="upside">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint (initTheme() re-validates it later)
			try { var _t = localStorage.getItem("cowriteTheme"); if (_t) document.documentElement.setAttribute("data-theme", _t); var _f = localStorage.getItem("cowriteFont"); if (_f) document.documentElement.setAttribute("data-font", _f) } catch (e) {}
		</script>
		<title>{{SITE_NAME}}: Solo Writes</title>
		<link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Inconsolata:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tiny5&family=Jersey+15&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/vendor/fontawesome/css/fa.min.css" />
		<link rel="stylesheet" href="/css/base.css" />
	</head>
	<body>
		<div class="wrap">
			<div class="archive-inner">
				<div class="archive-head">
					<a class="ghost" href="/dashboard" style="text-decoration: none; padding: 10px 16px; border-radius: 12px">← Back</a>
					<h2>Solo Writes</h2>
				</div>
				<p class="subtle" style="text-align: left; margin: 0 0 14px">
					Your own drafts, and anything you were invited to beta read. Invite friends when you want notes on yours.
				</p>
				<div class="row" style="margin-top: 0">
					<button class="primary" id="newDocBtn" style="flex: 0 0 auto">✒️ New solo write</button>
				</div>
				<div class="err" id="writesErr"></div>
				<div id="docList"></div>
			</div>
		</div>

		<!-- delete confirmation -->
		<div class="confirm-modal hidden" id="docDelModal">
			<div class="confirm-card">
				<h3>Delete “<span id="docDelName"></span>”?</h3>
				<p class="subtle" style="text-align: left">
					This permanently removes the document and every comment on it. There's no undo.
				</p>
				<div class="row">
					<button class="ghost" id="docDelCancel">Cancel</button>
					<button class="primary danger" id="docDelConfirm">Delete forever</button>
				</div>
				<div class="err" id="docDelErr"></div>
			</div>
		</div>

		<script type="module">
			import { api } from "/js/api.js"
			import { mountChrome, setUserChip } from "/js/chrome.js"
			import { requireAuth } from "/js/auth-guard.js"
			import { docShelfHtml } from "/js/write-view.js"

			mountChrome({ page: "writes" })
			const me = await requireAuth("/")
			setUserChip(me)
			const $ = (id) => document.getElementById(id)

			let docs = []
			let pendingDelete = null

			async function load() {
				try {
					docs = (await api("/api/docs", null, "GET")).docs || []
					$("docList").innerHTML = docShelfHtml(docs)
				} catch (e) {
					$("writesErr").textContent = e.message
				}
			}

			$("newDocBtn").addEventListener("click", async () => {
				$("writesErr").textContent = ""
				try {
					const { doc } = await api("/api/docs", { title: "Untitled" })
					location.href = "/write?id=" + encodeURIComponent(doc.id)
				} catch (e) {
					$("writesErr").textContent = e.message
				}
			})

			$("docList").addEventListener("click", (e) => {
				const del = e.target.closest(".doc-del")
				if (!del) return
				const card = del.closest(".doc-card")
				pendingDelete = card?.dataset.id
				const d = docs.find((x) => x.id === pendingDelete)
				$("docDelName").textContent = d ? d.title : "this document"
				$("docDelErr").textContent = ""
				$("docDelModal").classList.remove("hidden")
			})

			const closeDel = () => {
				$("docDelModal").classList.add("hidden")
				pendingDelete = null
			}
			$("docDelCancel").addEventListener("click", closeDel)
			$("docDelModal").addEventListener("click", (e) => {
				if (e.target === $("docDelModal")) closeDel()
			})
			$("docDelConfirm").addEventListener("click", async () => {
				if (!pendingDelete) return
				try {
					await api("/api/docs/" + encodeURIComponent(pendingDelete), null, "DELETE")
					closeDel()
					load()
				} catch (e) {
					$("docDelErr").textContent = e.message
				}
			})

			if (me) load()
		</script>
		<script src="/vendor/gsap.min.js"></script>
	</body>
</html>
