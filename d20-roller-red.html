<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>d20</title>

<!-- Optional: delete this line and the font-family falls back to system faces. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>

<style>
  :root{
    --ink:      #150708;
    --paper:    #f7e7de;
    --muted:    #a3807c;
    --gold:     #ffcf7d;
    --ash:      #9c8582;

    --die-size: 210px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden; }

  body{
    background:
      radial-gradient(120% 85% at 50% 12%, #3a1216 0%, #1e0a0d 52%, #0b0405 100%);
    color:var(--paper);
    font-family:"Space Grotesk", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }

  .surface{
    position:fixed;
    inset:0;
    overflow:hidden;
    touch-action:none;
  }

  /* ---------- the die ---------- */

  .stage{
    position:absolute;
    left:50%;
    top:50%;
    width:var(--die-size);
    height:var(--die-size);
    margin:calc(var(--die-size) / -2);
    perspective:900px;
    border:0;
    padding:0;
    background:none;
    outline:none;
    cursor:grab;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  .stage.grabbing{ cursor:grabbing; }
  .stage:focus-visible .flare{ opacity:.3; }

  .hover, .lift, .tilt, .die{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
  }
  .lift, .die{ will-change:transform; }

  .face{
    position:absolute;
    left:50%;
    top:50%;
    backface-visibility:hidden;
  }
  .face-in{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    backface-visibility:hidden;
    transform:scale(.9);
  }
  .pip{
    font-size:calc(var(--die-size) * .155);
    font-weight:700;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    line-height:1;
    transform:translateY(-6%);
  }
  .pip u{ text-decoration:none; border-bottom:.09em solid currentColor; padding-bottom:.08em; }

  .shadow{
    position:absolute;
    left:50%;
    bottom:-26px;
    width:78%;
    height:26px;
    border-radius:50%;
    background:radial-gradient(closest-side, rgba(0,0,0,.66), rgba(0,0,0,0));
    filter:blur(3px);
    pointer-events:none;
  }

  .flare{
    position:absolute;
    left:50%; top:50%;
    width:160%; height:160%;
    translate:-50% -50%;
    border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,168,92,.5), rgba(255,120,60,0) 70%);
    opacity:0;
    pointer-events:none;
    transition:opacity .45s ease;
  }
  .flare.on{ opacity:1; }

  /* ---------- readout ---------- */

  .hud{
    position:fixed;
    left:0; right:0; bottom:34px;
    text-align:center;
    pointer-events:none;
  }

  .result{
    font-size:60px;
    font-weight:700;
    line-height:.9;
    letter-spacing:-.04em;
    font-variant-numeric:tabular-nums;
    transition:color .3s ease, opacity .18s ease;
  }
  .result.rolling{ opacity:.2; }
  .result.crit  { color:var(--gold); text-shadow:0 0 30px rgba(255,180,100,.55); }
  .result.fumble{ color:var(--ash); }

  .tag{
    margin-top:12px;
    font-size:12px;
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    min-height:1em;
  }
  .tag.crit  { color:var(--gold); }
  .tag.fumble{ color:var(--ash); }

  @media (max-width:480px){
    :root{ --die-size:160px; }
    .result{ font-size:48px; }
    .hud{ bottom:24px; }
  }
</style>
</head>

<body>

<div class="surface" id="surface">
  <button class="stage" id="stage" aria-label="Roll the die. Drag to move it.">
    <div class="flare" id="flare"></div>
    <div class="hover" id="hover">
      <div class="lift" id="lift">
        <div class="tilt" id="tilt">
          <div class="die" id="die"></div>
        </div>
      </div>
    </div>
    <div class="shadow" id="shadow"></div>
  </button>

  <div class="hud">
    <div class="result" id="result" role="status" aria-live="polite">20</div>
    <div class="tag" id="tag">Drag to move · click to roll</div>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------ *
   * 1. Geometry — a real icosahedron, derived rather than hard-coded.
   * ------------------------------------------------------------------ */

  const PHI = (1 + Math.sqrt(5)) / 2;

  const sub   = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const dot   = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const unit  = a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0]/l, a[1]/l, a[2]/l]; };
  const dist2 = (a, b) => (a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // 12 vertices. These live in CSS space, where +y points DOWN.
  const V = [];
  for (const a of [1, -1]) for (const b of [1, -1]) {
    V.push([0, a, b*PHI], [a, b*PHI, 0], [b*PHI, 0, a]);
  }

  // 20 faces = every vertex triple whose three edges are all the edge length (2).
  const TRI = [];
  for (let i = 0; i < 12; i++)
    for (let j = i+1; j < 12; j++)
      for (let k = j+1; k < 12; k++)
        if (Math.abs(dist2(V[i],V[j]) - 4) < 1e-6 &&
            Math.abs(dist2(V[i],V[k]) - 4) < 1e-6 &&
            Math.abs(dist2(V[j],V[k]) - 4) < 1e-6) TRI.push([i, j, k]);

  const CIRCUM = Math.hypot(...V[0]);

  // Per-face orthonormal basis. ez = outward normal, ey = down-in-face,
  // ex = ey × ez. Putting the first vertex at local -y makes every triangle
  // render point-up with its numeral upright, like a real die.
  const FACES = TRI.map(tri => {
    const c  = [0,1,2].map(t => (V[tri[0]][t] + V[tri[1]][t] + V[tri[2]][t]) / 3);
    const ez = unit(c);
    const ey = unit(sub(c, V[tri[0]]));
    const ex = cross(ey, ez);
    const proj = tri.map(vi => { const d = sub(V[vi], c); return [dot(d, ex), dot(d, ey)]; });
    return { c, ex, ey, ez, proj };
  });

  // Opposite faces sum to 21, same as a real d20.
  const NUM = new Array(20).fill(0);
  for (let i = 0, n = 1; i < 20; i++) {
    if (NUM[i]) continue;
    const opp = FACES.findIndex((f, j) => j !== i && dot(FACES[i].ez, f.ez) < -0.999);
    NUM[i] = n; NUM[opp] = 21 - n; n++;
  }

  /* ------------------------------------------------------------------ *
   * 2. Quaternions — orientation, so spins never gimbal-lock.
   * ------------------------------------------------------------------ */

  const qMul = (a, b) => [
    a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1],
    a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
    a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
    a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2],
  ];

  const qNorm = q => { const l = Math.hypot(...q); return q.map(v => v / l); };

  const qAxis = (axis, angle) => {
    const [x, y, z] = unit(axis), s = Math.sin(angle / 2);
    return [x*s, y*s, z*s, Math.cos(angle / 2)];
  };

  const qFromRows = (r0, r1, r2) => {
    const t = r0[0] + r1[1] + r2[2];
    if (t > 0) {
      const s = 0.5 / Math.sqrt(t + 1);
      return qNorm([(r2[1]-r1[2])*s, (r0[2]-r2[0])*s, (r1[0]-r0[1])*s, 0.25/s]);
    }
    if (r0[0] > r1[1] && r0[0] > r2[2]) {
      const s = 2 * Math.sqrt(1 + r0[0] - r1[1] - r2[2]);
      return qNorm([0.25*s, (r0[1]+r1[0])/s, (r0[2]+r2[0])/s, (r2[1]-r1[2])/s]);
    }
    if (r1[1] > r2[2]) {
      const s = 2 * Math.sqrt(1 + r1[1] - r0[0] - r2[2]);
      return qNorm([(r0[1]+r1[0])/s, 0.25*s, (r1[2]+r2[1])/s, (r0[2]-r2[0])/s]);
    }
    const s = 2 * Math.sqrt(1 + r2[2] - r0[0] - r1[1]);
    return qNorm([(r0[2]+r2[0])/s, (r1[2]+r2[1])/s, 0.25*s, (r1[0]-r0[1])/s]);
  };

  const dot4 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];

  const qSlerp = (a, b, t) => {
    let d = dot4(a, b);
    if (d < 0) { b = b.map(v => -v); d = -d; }
    if (d > 0.9995) return qNorm(a.map((v, i) => v + (b[i] - v) * t));
    const th = Math.acos(d), s = Math.sin(th);
    return a.map((v, i) => v * Math.sin((1 - t) * th) / s + b[i] * Math.sin(t * th) / s);
  };

  const qRotate = (q, v) => {
    const [x, y, z, w] = q;
    const t = [2*(y*v[2] - z*v[1]), 2*(z*v[0] - x*v[2]), 2*(x*v[1] - y*v[0])];
    return [
      v[0] + w*t[0] + y*t[2] - z*t[1],
      v[1] + w*t[1] + z*t[0] - x*t[2],
      v[2] + w*t[2] + x*t[1] - y*t[0],
    ];
  };

  const qToMatrix3d = q => {
    const [x, y, z, w] = q;
    const m = [
      1-2*(y*y+z*z), 2*(x*y+z*w),   2*(x*z-y*w),   0,
      2*(x*y-z*w),   1-2*(x*x+z*z), 2*(y*z+x*w),   0,
      2*(x*z+y*w),   2*(y*z-x*w),   1-2*(x*x+y*y), 0,
      0, 0, 0, 1,
    ];
    return "matrix3d(" + m.map(v => v.toFixed(6)).join(",") + ")";
  };

  /* ------------------------------------------------------------------ *
   * 3. Build the 20 faces.
   * ------------------------------------------------------------------ */

  const surface = document.getElementById("surface");
  const stage   = document.getElementById("stage");
  const hoverEl = document.getElementById("hover");
  const lift    = document.getElementById("lift");
  const tilt    = document.getElementById("tilt");
  const die     = document.getElementById("die");
  const shadow  = document.getElementById("shadow");
  const flare   = document.getElementById("flare");
  const result  = document.getElementById("result");
  const tag     = document.getElementById("tag");

  const faceEls = [];

  function build() {
    const size  = stage.getBoundingClientRect().width || 210;
    const scale = size / (2 * CIRCUM);
    const R     = 2 / Math.sqrt(3);              // face circumradius, model units
    const side  = 2 * R * scale;                 // px

    die.textContent = "";
    faceEls.length = 0;

    FACES.forEach((f, i) => {
      const poly = f.proj
        .map(([px, py]) => `${((px + R) / (2*R) * 100).toFixed(3)}% ${((py + R) / (2*R) * 100).toFixed(3)}%`)
        .join(", ");

      const el = document.createElement("div");
      el.className = "face";
      el.style.width  = side + "px";
      el.style.height = side + "px";
      el.style.marginLeft = el.style.marginTop = (-side / 2) + "px";
      el.style.clipPath = `polygon(${poly})`;
      el.style.transform =
        "matrix3d(" + [
          ...f.ex, 0,
          ...f.ey, 0,
          ...f.ez, 0,
          ...f.c.map(v => v * scale), 1,
        ].map(v => (+v).toFixed(6)).join(",") + ")";

      const inner = document.createElement("div");
      inner.className = "face-in";
      inner.style.clipPath = `polygon(${poly})`;

      const n = NUM[i];
      const pip = document.createElement("span");
      pip.className = "pip";
      pip.innerHTML = (n === 6 || n === 9) ? `<u>${n}</u>` : String(n);

      inner.appendChild(pip);
      el.appendChild(inner);
      die.appendChild(el);
      faceEls.push({ el, inner, pip, normal: f.ez });
    });
  }

  /* ------------------------------------------------------------------ *
   * 4. Shading — recomputed per frame so the die catches light.
   * ------------------------------------------------------------------ */

  const LIGHT = unit([-0.35, -0.62, 0.85]);      // upper-left, in front

  // Red resin: deep oxblood in shadow, hot vermilion in the light.
  const RESIN = [[44, 8, 14],   [216, 46, 44]];
  const EDGE  = [[74, 16, 22],  [255, 122, 96]];
  const PIPC  = [[124, 78, 66], [255, 240, 226]];

  const mix = (a, b, t) =>
    `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;

  function shade(q) {
    for (const f of faceEls) {
      const n = qRotate(q, f.normal);
      const t = 0.16 + 0.84 * Math.pow(Math.max(0, dot(n, LIGHT)), 0.75);
      f.el.style.backgroundColor    = mix(EDGE[0],  EDGE[1],  t);
      f.inner.style.backgroundColor = mix(RESIN[0], RESIN[1], t);
      f.pip.style.color             = mix(PIPC[0],  PIPC[1],  Math.max(t, 0.36));
    }
  }

  /* ------------------------------------------------------------------ *
   * 5. State + painting.
   * ------------------------------------------------------------------ */

  // A small fixed tilt so the landed face reads as a face of a solid
  // rather than a flat card pasted on the screen.
  const TILT = qMul(qAxis([0,1,0], 0.14), qAxis([1,0,0], -0.24));

  const restQuat = i => {
    const f = FACES[i];
    return qMul(TILT, qFromRows(f.ex, f.ey, f.ez));
  };

  const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let restingFace = Math.floor(Math.random() * 20);
  let current = restQuat(restingFace);
  let tossY = 0, tossScale = 1, hoverV = 0;
  let rolling = false;

  function paintShadow() {
    const h = clamp(-tossY / 90 + hoverV * 0.55, 0, 1.2);
    shadow.style.transform = `translate(-50%, 0) scale(${(1 - h * 0.36).toFixed(3)})`;
    shadow.style.opacity   = clamp(0.92 - h * 0.5, 0.1, 1).toFixed(3);
  }

  function paint() {
    die.style.transform  = qToMatrix3d(current);
    lift.style.transform = `translate3d(0, ${tossY.toFixed(2)}px, 0) scale(${tossScale.toFixed(3)})`;
    paintShadow();
    shade(current);
  }

  /* ------------------------------------------------------------------ *
   * 6. The roll — driven by a GSAP tween of a single progress value.
   * ------------------------------------------------------------------ */

  const hasGsap = typeof window.gsap !== "undefined";
  let rollTween = null, rafId = null;

  function roll() {
    const faceIndex = Math.floor(Math.random() * 20);
    const value  = NUM[faceIndex];
    const target = restQuat(faceIndex);
    restingFace  = faceIndex;

    flare.classList.remove("on");
    result.classList.remove("crit", "fumble");
    tag.classList.remove("crit", "fumble");

    if (reduceMotion) {
      current = target; tossY = 0; tossScale = 1;
      paint(); land(value);
      return;
    }

    result.classList.add("rolling");
    tag.textContent = "Rolling";
    rolling = true;

    const DURATION = 1.4 + Math.random() * 0.3;  // seconds
    const TUMBLE   = 0.56;                       // fraction spent free-spinning
    const axis     = unit([Math.random()*2-1, Math.random()*2-1, Math.random()*2-1]);
    const speed    = 13 + Math.random() * 6;     // radians per second, roughly
    const start    = current;
    let   handoff  = start;

    const frame = p => {
      if (p < TUMBLE) {
        const k = p / TUMBLE;
        const angle = speed * DURATION * (k - 0.45 * k * k);
        current = qNorm(qMul(qAxis(axis, angle), start));
        handoff = current;
      } else {
        current = qNorm(qSlerp(handoff, target, easeOutQuint((p - TUMBLE) / (1 - TUMBLE))));
      }
      // Toss: up, down, one small bounce, then still.
      tossY     = -96 * Math.abs(Math.sin(Math.PI * p * 1.85)) * Math.pow(1 - p, 0.85);
      tossScale = 1 + 0.05 * Math.sin(Math.PI * p * 1.85) * (1 - p);
      paint();
    };

    const finish = () => {
      current = target; tossY = 0; tossScale = 1;
      paint(); rolling = false; land(value);
    };

    if (hasGsap) {
      rollTween && rollTween.kill();
      const state = { p: 0 };
      rollTween = gsap.to(state, {
        p: 1, duration: DURATION, ease: "none",
        onUpdate: () => frame(state.p),
        onComplete: finish,
      });
    } else {
      cancelAnimationFrame(rafId);
      const t0 = performance.now();
      const step = now => {
        const p = Math.min(1, (now - t0) / (DURATION * 1000));
        frame(p);
        if (p < 1) rafId = requestAnimationFrame(step); else finish();
      };
      rafId = requestAnimationFrame(step);
    }
  }

  function land(value) {
    result.classList.remove("rolling");
    result.textContent = value;

    if (value === 20) {
      result.classList.add("crit");
      tag.classList.add("crit");
      tag.textContent = "Natural 20";
      flare.classList.add("on");
      setTimeout(() => flare.classList.remove("on"), 1100);
    } else if (value === 1) {
      result.classList.add("fumble");
      tag.classList.add("fumble");
      tag.textContent = "Natural 1";
    } else {
      tag.textContent = "Roll again";
    }

    stage.dispatchEvent(new CustomEvent("d20:roll", { detail: { value }, bubbles: true }));
  }

  /* ------------------------------------------------------------------ *
   * 7. Dragging — GSAP Draggable, with a lean and a throw.
   * ------------------------------------------------------------------ */

  let dragger = null;

  function setupDrag() {
    if (!hasGsap || typeof window.Draggable === "undefined") {
      tag.textContent = "Click to roll";
      stage.style.cursor = "pointer";
      stage.addEventListener("click", roll);
      return;
    }

    gsap.registerPlugin(Draggable);

    // Velocity is sampled by hand so this works without InertiaPlugin.
    let lastX = 0, lastY = 0, lastT = 0, vx = 0, vy = 0;

    const hoverState = { v: 0 };
    const applyHover = () => {
      hoverV = hoverState.v;
      hoverEl.style.transform = `translate3d(0, ${(-18 * hoverV).toFixed(2)}px, 0)`;
      paintShadow();
    };

    const lean = (rx, ry, dur, ease) =>
      reduceMotion ? null : gsap.to(tilt, {
        rotationX: rx, rotationY: ry, duration: dur, ease, overwrite: "auto",
      });

    dragger = Draggable.create(stage, {
      type: "x,y",
      bounds: surface,
      allowEventDefault: false,
      allowNativeTouchScrolling: false,

      onPress() {
        stage.classList.add("grabbing");
        lastX = this.x; lastY = this.y; lastT = performance.now(); vx = vy = 0;
        gsap.to(hoverState, { v: 1, duration: 0.22, ease: "power2.out", onUpdate: applyHover });
      },

      onDrag() {
        const now = performance.now();
        const dt  = Math.max(16, now - lastT);
        vx = (this.x - lastX) / dt * 1000;
        vy = (this.y - lastY) / dt * 1000;
        lastX = this.x; lastY = this.y; lastT = now;

        // The die leans away from the direction it's being dragged.
        lean(clamp(vy * 0.012, -20, 20), clamp(vx * 0.012, -20, 20), 0.4, "power2.out");
      },

      onRelease() {
        stage.classList.remove("grabbing");
        gsap.to(hoverState, { v: 0, duration: 0.45, ease: "power2.out", onUpdate: applyHover });
        lean(0, 0, 0.9, "elastic.out(1, 0.45)");

        // A hard flick throws the die and rolls it. The landing spot is
        // clamped to the same bounds Draggable is already enforcing.
        if (Math.hypot(vx, vy) > 650) {
          gsap.to(stage, {
            x: clamp(this.x + vx * 0.22, this.minX, this.maxX),
            y: clamp(this.y + vy * 0.22, this.minY, this.maxY),
            duration: 1.0,
            ease: "power3.out",
          });
          roll();
        }
      },

      // Draggable only fires this when the pointer didn't actually move.
      onClick: roll,
    });

    stage.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); roll(); }
    });
  }

  /* ------------------------------------------------------------------ *
   * 8. Go.
   * ------------------------------------------------------------------ */

  build();
  paint();
  result.textContent = NUM[restingFace];
  setupDrag();

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      build(); paint();
      if (dragger) dragger[0].applyBounds(surface);
    }, 150);
  });

  window.d20 = { roll, isRolling: () => rolling };
})();
</script>

</body>
</html>
