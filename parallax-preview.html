<div class="bar">
 <label>drift <input id="amt" type="range" min="0" max="60" value="26"></label>
 <span id="amtv">26px</span>
 <button id="edge" aria-pressed="false">show layer edges</button>
 <button id="sweep" aria-pressed="false">auto sweep</button>
</div>
<div class="bar key">
 <span><i class="sw" style="background:#0B3126"></i>1 darkest · depth 1.00</span>
 <span><i class="sw" style="background:#2A5246"></i>2 dark · 0.55</span>
 <span><i class="sw" style="background:#5F795D"></i>3 mid · 0.28</span>
 <span><i class="sw" style="background:#9DA976"></i>4 lightest · 0.10</span>
</div>
<script>
const stage=document.getElementById('stage'),ls=[...stage.querySelectorAll('.layer')];
const amt=document.getElementById('amt'),amtv=document.getElementById('amtv');
let x=0,y=0,sweep=false,t=0;
function draw(){for(const l of ls){const d=+l.dataset.depth,a=+amt.value;
 l.style.transform=`translate3d(${-x*a*d}px,${-y*a*d*.45}px,0)`;}}
stage.addEventListener('pointermove',e=>{if(sweep)return;const r=stage.getBoundingClientRect();
 stage.classList.add('live');x=(e.clientX-r.left)/r.width*2-1;y=(e.clientY-r.top)/r.height*2-1;draw();});
stage.addEventListener('pointerleave',()=>{if(sweep)return;stage.classList.remove('live');x=y=0;draw();});
amt.addEventListener('input',()=>{amtv.textContent=amt.value+'px';draw();});
document.getElementById('edge').addEventListener('click',e=>{const on=stage.classList.toggle('outline');
 e.currentTarget.setAttribute('aria-pressed',on);});
document.getElementById('sweep').addEventListener('click',e=>{sweep=!sweep;
 e.currentTarget.setAttribute('aria-pressed',sweep);stage.classList.toggle('live',sweep);
 if(sweep)loop();});
function loop(){if(!sweep)return;t+=0.012;x=Math.sin(t);y=Math.sin(t*0.6)*0.5;draw();requestAnimationFrame(loop);}
draw();
</script></body></html>
